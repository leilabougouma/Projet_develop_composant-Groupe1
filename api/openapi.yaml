openapi: 3.0.1
info:
  title: API Produits
  description: "API REST de gestion des produits (CRUD, pagination, filtre par caté\
    gorie)"
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Local
tags:
- name: Produits
  description: Opérations CRUD sur les produits
paths:
  /api/v1/produits/{id}:
    get:
      tags:
      - Produits
      summary: Consulter un produit
      operationId: consulter
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "404":
          description: Produit absent
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Produit trouvé
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProduitResponse"
    put:
      tags:
      - Produits
      summary: Modifier un produit
      operationId: modifier
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProduitRequest"
        required: true
      responses:
        "400":
          description: Données invalides
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Produit absent
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Produit modifié
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProduitResponse"
    delete:
      tags:
      - Produits
      summary: Supprimer un produit
      operationId: supprimer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Produit supprimé (message de confirmation et produit supprimé)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SuppressionResponse"
        "404":
          description: Produit absent
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/produits:
    get:
      tags:
      - Produits
      summary: "Lister les produits (pagination, filtre par catégorie)"
      operationId: lister
      parameters:
      - name: categorie
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: Page de produits
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseProduitResponse"
        "400":
          description: Paramètres de pagination invalides
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
      - Produits
      summary: Créer un produit
      operationId: creer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProduitRequest"
        required: true
      responses:
        "400":
          description: Données invalides
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "201":
          description: Produit créé
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProduitResponse"
components:
  schemas:
    ProduitRequest:
      required:
      - categorie
      - nom
      - prix
      - quantite
      type: object
      properties:
        nom:
          maxLength: 150
          minLength: 0
          type: string
          example: Clavier mécanique
        description:
          type: string
          example: Clavier AZERTY rétroéclairé
        prix:
          type: number
          example: 59.9
        quantite:
          type: integer
          format: int32
          example: 25
        categorie:
          maxLength: 100
          minLength: 0
          type: string
          example: Informatique
      description: Données d'un produit à créer ou à remplacer
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/FieldViolation"
    FieldViolation:
      type: object
      properties:
        champ:
          type: string
        message:
          type: string
    ProduitResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        nom:
          type: string
        description:
          type: string
        prix:
          type: number
        quantite:
          type: integer
          format: int32
        categorie:
          type: string
        dateCreation:
          type: string
          format: date-time
    PageResponseProduitResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ProduitResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    SuppressionResponse:
      type: object
      properties:
        message:
          type: string
          example: Produit 12 supprimé
        produit:
          $ref: "#/components/schemas/ProduitResponse"
      description: "Confirmation de suppression, avec le produit tel qu'il était avant\
        \ d'être supprimé"
